# Host nginx site for the public gate. Installed on the MGG host with
# `sudo` (sites-available + certbot). Do not edit live nginx from CI.
#
# web listens on 127.0.0.1:5173 and already proxies /api to the System Layer.

server {
    listen 80;
    listen [::]:80;
    server_name navix.droidje.com;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
