# Host nginx site for the public gate. Installed on the MGG host with
# `sudo` (sites-available + certbot). Do not edit live nginx from CI.
#
# web listens on 127.0.0.1:5173 and already proxies /api to the System Layer.

server {
    listen 80;
    listen [::]:80;
    server_name navix.droidje.com;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        # Long enough for an assistant run, which streams while the model and its tools work.
        proxy_read_timeout 600s;
        # Both proxies on the path have to stop buffering, or the Server-Sent Events of an
        # assistant run arrive in one burst at the end. The container's own nginx sets the
        # same pair; whichever still buffers is the one that decides.
        proxy_buffering off;
        proxy_cache off;
    }
}
