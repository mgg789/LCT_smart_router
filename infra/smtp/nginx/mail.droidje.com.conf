# HTTP-01 for mail.droidje.com and a closed default vhost.
# Hysteria already owns UDP/443; nginx keeps TCP/80 and TCP/443.
server {
    listen 80;
    listen [::]:80;
    server_name mail.droidje.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}
