# HTTP-01 for openrouter.droidje.com (OpenRouter mirror certificate);
# the mail.droidje.com challenge vhost stays in mail.droidje.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name openrouter.droidje.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}
