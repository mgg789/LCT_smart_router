# OpenRouter mirror: transparent reverse proxy for LLM API calls (Jev), giving
# the prod API an EU egress. An independent vhost: shares nothing with the mail
# stack except the host nginx process. The upstream Authorization header (the
# real OpenRouter key) is injected server-side; callers only hold the proxy
# token checked by the map below. UDP/443 belongs to Hysteria, TCP/80 and
# TCP/443 to the existing vhosts, so the mirror listens on its own port with
# the existing mail.droidje.com certificate.
# Both includes are generated on the host by the apply (0640 root:www-data):
#   /etc/navix-smtp/openrouter-mirror.map.nginx      -> token gate (http-level map)
#   /etc/navix-smtp/openrouter-mirror.upstream.nginx -> injected upstream headers

include /etc/navix-smtp/openrouter-mirror.map.nginx;

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name mail.droidje.com;

    ssl_certificate /etc/letsencrypt/live/mail.droidje.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.droidje.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openrouter-mirror.access.log;

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"service":"openrouter-mirror"}';
    }

    location / {
        if ($openrouter_authorized = 0) { return 401; }

        include /etc/navix-smtp/openrouter-mirror.upstream.nginx;

        # openrouter.ai sits behind a rotating CDN: re-resolve at runtime
        # instead of caching the IP from config load.
        resolver 127.0.0.53 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $openrouter_backend https://openrouter.ai;
        proxy_pass $openrouter_backend;

        proxy_http_version 1.1;
        proxy_set_header Host openrouter.ai;
        proxy_set_header Connection "";
        # Never forward the mirror token upstream.
        proxy_set_header X-Proxy-Token "";

        proxy_ssl_server_name on;
        proxy_ssl_name openrouter.ai;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;

        proxy_connect_timeout 15s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # LLM answers may stream for minutes.
        proxy_buffering off;
        client_max_body_size 10m;
    }
}
