# Local and demo contour of the LCT Smart Router.
#
# Run from the repository root so that the build context and the environment file line
# up with the workspace layout:
#
#   cp .env.example .env
#   docker compose -f infra/docker-compose.yml up -d --build
#
# Contour: postgres, migrate, router, api, web. The dashboard (`web`) is reached at
# http://127.0.0.1:5173 and proxies `/api` to the System Layer on the compose network.

name: lct-smart-router

services:
  postgres:
    # pgvector is not used yet; the image is chosen now so that enabling the extension
    # for the knowledge segments later needs no change here (context/37 section 2.1).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lct_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lct}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Bound to the loopback interface only: reachable for psql and integration tests on
    # this machine, not published to the network (context/43 section 11.2).
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      # The init-only postmaster accepts Unix sockets, then restarts. Consumers
      # use TCP, so readiness must wait for the final TCP-listening server.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-lct} -d ${POSTGRES_DB:-lct}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot schema migration. Runs from the same image as the service, so the code and
  # the schema it expects can never be two different versions. Prisma Migrate is the
  # single owner of schema history; there is no create-on-boot anywhere in the runtime
  # (context/43 section 5.4 as amended by D-23).
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', '--filter', 'api', 'exec', 'prisma', 'migrate', 'deploy']
    restart: 'no'
    environment:
      # Explicit and container-local: inside the network the database is `postgres`,
      # while a developer's .env points at 127.0.0.1. Setting it here avoids that clash.
      DATABASE_URL: postgresql://${POSTGRES_USER:-lct}:${POSTGRES_PASSWORD:-lct_dev_password}@postgres:5432/${POSTGRES_DB:-lct}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  router-db-bootstrap:
    image: pgvector/pgvector:pg17
    restart: 'no'
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-lct_dev_password}
      ROUTER_DB_PASSWORD: ${ROUTER_DB_PASSWORD:-router_dev_password}
    volumes:
      - ./postgres/enable-router-login.sql:/bootstrap/enable-router-login.sql:ro
    command:
      - sh
      - -ec
      - >-
        psql --host=postgres --username=${POSTGRES_USER:-lct} --dbname=${POSTGRES_DB:-lct}
        --set=ON_ERROR_STOP=1 --set=router_password="$${ROUTER_DB_PASSWORD}"
        --file=/bootstrap/enable-router-login.sql
    depends_on:
      migrate:
        condition: service_completed_successfully

  router:
    build:
      context: ..
      dockerfile: core/Dockerfile
    restart: unless-stopped
    # The bundled road service prepares solver costs in batches. The host alias
    # remains available for an explicitly configured operator-owned endpoint.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      ROUTER_DATABASE_URL: postgresql://router_readonly:${ROUTER_DB_PASSWORD:-router_dev_password}@postgres:5432/${POSTGRES_DB:-lct}?sslmode=disable
      ROUTER_ROAD_API_URL: ${ROUTER_ROAD_API_URL:-http://road-api:8123}
      ROUTER_ROAD_API_CACHE: /app/state/road-api-cache
      ROUTER_ROAD_API_MAP_VERSION: moscow-mkad
      # Universal route engine v3 (/route3, /matrix3, /metro3): car matrix with
      # traffic, pedestrian/cyclist graph and metro paths as pluggable graphs.
      ROUTE3_URL: ${ROUTE3_URL:-http://route-engine3:8124}
      ROUTER_HYBRID: ${ROUTER_HYBRID:-false}
      ROUTER_METRICS_ENABLED: ${ROUTER_METRICS_ENABLED:-false}
      ROUTER_OTEL_ENABLED: ${ROUTER_OTEL_ENABLED:-false}
      ROUTER_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${ROUTER_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      ROUTER_OTEL_TRACE_SAMPLE_RATIO: ${ROUTER_OTEL_TRACE_SAMPLE_RATIO:-0.1}
      ROUTER_SENTRY_ENABLED: ${ROUTER_SENTRY_ENABLED:-false}
      ROUTER_SENTRY_DSN: ${ROUTER_SENTRY_DSN:-}
      ROUTER_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      ROUTER_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Optional read-only catalog cache. No dependency: Router keeps working if Redis is down.
      ROUTER_REDIS_BETA: ${ROUTER_REDIS_BETA:-false}
      ROUTER_REDIS_URL: ${ROUTER_REDIS_URL:-}
      ROUTER_REDIS_NAMESPACE: ${ROUTER_REDIS_NAMESPACE:-lct-smart-router}
      ROUTER_REDIS_TTL_SEC: ${ROUTER_REDIS_TTL_SEC:-600}
    command:
      - serve
      - --official-regions
      - east
      - southeast
      - south_central
      - --dataset-dir
      - /app/data/dataset/anonymized
      - --host
      - 0.0.0.0
      - --port
      - '8100'
      - --budget-ms
      - '${ROUTER_BUDGET_MS:-8000}'
      - --settings
      - /app/state/settings.json
    volumes:
      - ../data/dataset:/app/data/dataset:ro
      - router-state:/app/state
    depends_on:
      router-db-bootstrap:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${ROUTER_PORT:-8100}:8100'

  redis:
    image: redis:8.2-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    profiles: [redis-beta]
    restart: unless-stopped
    user: redis
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    pids_limit: 64
    tmpfs: ['/data:mode=1777,size=16m']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -ec
      - >-
        test -n "$${REDIS_PASSWORD}" || { echo 'Redis beta password is required' >&2; exit 1; };
        exec redis-server --requirepass "$${REDIS_PASSWORD}" --save '' --appendonly no
        --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 2s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # `cp .env.example .env` is required before the first start: the dispatcher's
    # credentials have no defaults on purpose. A compose file is not a place to keep a
    # working password, and a silent fallback would become one.
    env_file:
      - path: ../.env
        required: true
    # Hysteria SMTP forwards live on the host loopback. Without this alias the
    # API container's 127.0.0.1 is itself, so SMTP_HOST=host.docker.internal.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # Only container topology is set here; application configuration comes from .env, so
    # there is one place to look and no silent override. In particular NODE_ENV is the
    # operator's choice. Local development may expose one-time codes; the public
    # contour runs production mode with SMTP and must never return them over HTTP.
    environment:
      PORT: 8000
      # This local contour is the feature demo: today's walking engineer, passports
      # and the rewind action. Unset DEMO_STAND in the shell env to keep a plain day.
      DEMO_STAND: ${DEMO_STAND:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lct}:${POSTGRES_PASSWORD:-lct_dev_password}@postgres:5432/${POSTGRES_DB:-lct}?schema=public
      DATASET_ROOT: /app/data/dataset/anonymized
      ROUTER_BASE_URL: http://router:8100
      # Road geometry for city legs (MKAD OSRM graph, /route2 with the v2 traffic
      # model). The graph is vendored in services/road-api and always deployed.
      # The API borrows selected-leg polylines. Router prepares costs separately
      # from the same road service before searching; it never queries each move.
      API_ROAD_API_URL: ${API_ROAD_API_URL:-http://road-api:8123}
      ROUTE3_URL: ${ROUTE3_URL:-http://route-engine3:8124}
      ROUTER_POLL_INTERVAL_MS: ${ROUTER_POLL_INTERVAL_MS:-500}
      ROUTER_REQUEST_TIMEOUT_MS: ${ROUTER_REQUEST_TIMEOUT_MS:-3000}
    volumes:
      # Read-only bind mount rather than a copy into the image: the dataset is data, not
      # code, and the geocode sidecar the data zone will add must appear without a rebuild.
      - ../data/dataset:/app/data/dataset:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      router:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'

  # Server-side System one: answers the same /v1/choice and /v1/noul contract as the
  # developer's local jev-local gateway, from a chat completion endpoint (the
  # OpenRouter mirror in the demo contour). Never published to a host port: the API
  # reaches it over the compose network as http://sys1:12444 when .env sets
  # JEV_API_URL accordingly. Unset SYS1_LLM_BASE_URL keeps it answering 503, which
  # the application treats as its documented degradation.
  sys1:
    build:
      context: ../services/sys1
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SYS1_LLM_BASE_URL: ${SYS1_LLM_BASE_URL:-}
      SYS1_LLM_TOKEN: ${LLM_PROXY_TOKEN:-}
      SYS1_MODEL: ${SYS1_MODEL:-typesafe/jev-1.13}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:12444/health >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

  # MKAD road graph (OSRM MLD, vendored under services/route-engine3/graphs/car —
  # one vendored copy shared by road-api and route-engine3). Serves road
  # geometry and travel times to the road-api below; graph pages are copied into a
  # tmpfs so cold queries stay in milliseconds (services/road-api/README.md).
  osrm:
    # The vendored graph was built by osrm v26.x (see services/road-api/README.md);
    # older majors cannot read its fingerprint format.
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    command: >
      sh -c 'cp /src/moscow-mkad.osrm* /graph/ &&
      osrm-routed --algorithm mld --max-table-size 4096 /graph/moscow-mkad.osrm'
    volumes:
      - ../services/route-engine3/graphs/car:/src:ro
    tmpfs:
      - /graph:size=768m

  # Point-to-point road routing over the graph above (/route, /route2, /matrix2).
  # The System Layer calls /route2 for road polylines; /health reports osrm reach.
  road-api:
    build:
      context: ../services/road-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OSRM_URL: http://osrm:5000
    volumes:
      - ../services/road-api/data:/srv/data:ro
    depends_on:
      - osrm
    healthcheck:
      # Ready only when OSRM answers: the first queries warm the graph pages.
      test: ['CMD-SHELL', 'python3 -c "import json,urllib.request; assert json.load(urllib.request.urlopen(\"http://127.0.0.1:8123/health\", timeout=25))[\"osrm\"]"']
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s

  # Universal route engine v3 (docs/route3.md): a self-contained unit that
  # supervises one osrm-routed per graph folder (graphs/car, graphs/foot — drop
  # a folder to add a graph) and serves /route3, /matrix3, /metro3. Walk/bike
  # costs are flat average speeds; traffic forecasting applies to car only.
  route-engine3:
    build:
      context: ../services/route-engine3
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      METRO_DATA_PATH: /srv/metro/moscow.json
    volumes:
      - ../services/route-engine3/graphs:/srv/graphs:ro
      - ../core/resources/metro:/srv/metro:ro
    tmpfs:
      # Both vendored graphs are copied here before osrm-routed starts so that
      # every query stays in memory rather than faulting over the bind mount.
      - /graph-pages:size=1024m
    healthcheck:
      test: ['CMD-SHELL', 'python3 -c "import json,urllib.request; assert json.load(urllib.request.urlopen(\"http://127.0.0.1:8124/health\", timeout=25))[\"ready\"]"']
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 90s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SENTRY_ENABLED: ${VITE_SENTRY_ENABLED:-false}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
        VITE_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:80'

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    restart: unless-stopped
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d', '--storage.tsdb.retention.size=1GB']
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'

  otel-collector:
    image: otel/opentelemetry-collector:0.133.0
    profiles: [observability]
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yaml:ro
    # OTLP is internal to the compose network; no public ingestion port.

volumes:
  prometheus-data:
  # Named volume, not a bind mount: an ordinary restart must keep the working plan, the
  # control mode and lunch facts (context/43 section 11.3). Removing this volume is not
  # a substitute for the application's own "full reset" action.
  postgres-data:
  router-state:
