# Secret scan allowlist. Placeholders in the documented env template are not live
# credentials; gitleaks still fails on anything that looks like a real key elsewhere.
title = "LCT Smart Router"

[extend]
useDefault = true

[allowlist]
description = "Documented placeholders, the published jury login in README, and demo fixtures"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)README\.md$''',
  '''(^|/)demo/''',
  '''(^|/)docs/''',
  '''(^|/)context/''',
]
# Published demo-stand password in the root README. The live .env is still scanned.
regexes = [
  '''9658dd575f3abab304123a2c''',
]
