server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        # An assistant run streams for as long as the model and its tools take, which is
        # longer than an ordinary request but still bounded by the server's own run budget.
        proxy_read_timeout 600s;
        # Server-Sent Events must reach the browser as they are produced. With buffering on
        # -- the default -- nginx holds the whole stream and releases it at the end, so the
        # chat looks frozen and then answers all at once. The symptom appears only behind
        # this proxy, never in the Vite dev server, which is why it is pinned here.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
