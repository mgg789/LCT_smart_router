<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МКАД-роутер v2 — пробки по времени и направлению</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", sans-serif; }
  #map { height: 100%; }
  .panel {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: rgba(255,255,255,.97); border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.25); padding: 14px 16px;
    width: 380px; max-width: calc(100vw - 24px);
    max-height: calc(100vh - 24px); overflow-y: auto;
  }
  .panel h1 { margin: 0 0 4px; font-size: 17px; }
  .panel h1 a { color: inherit; text-decoration: none; font-size: 12px; font-weight: 400; color: #2563eb; }
  .panel .hint { color: #555; font-size: 12.5px; margin: 0 0 10px; }
  .status { font-size: 12px; margin-bottom: 8px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .dot.ok { background: #16a34a; } .dot.bad { background: #dc2626; }
  .timebar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .timebar input[type=datetime-local] { font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; padding: 4px 6px; }
  .timebar button { font-size: 12px; border: 1px solid #d1d5db; background: #f9fafb; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  .timebar button:hover { background: #eef2ff; }
  #result { font-size: 14px; line-height: 1.45; }
  #result .mode-road { color: #1d4ed8; font-weight: 600; }
  #result .mode-straight { color: #c2410c; font-weight: 600; }
  #result .err { color: #dc2626; }
  #result .pts { color: #555; font-size: 12px; margin-top: 6px; }
  .dur { font-size: 16px; }
  .dur b { font-size: 19px; }
  .dur .base { color: #6b7280; text-decoration: line-through; font-size: 14px; margin-right: 6px; }
  .badge { display:inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px;
           background: #e5e7eb; margin-right: 4px; }
  .badge.in { background: #dcfce7; color: #166534; }
  .badge.out { background: #fee2e2; color: #991b1b; }
  .badge.period { background: #fef3c7; color: #92400e; }
  .breakdown { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  .breakdown td, .breakdown th { border-top: 1px solid #e5e7eb; padding: 3px 4px; text-align: left; }
  .breakdown th { color: #6b7280; font-weight: 500; }
  .mk { font-size: 12px; font-weight: 700; color: #fff; background: #1d4ed8;
        border-radius: 50%; width: 22px; height: 22px; display: flex;
        align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .mk.b { background: #dc2626; }
  details { margin-top: 10px; font-size: 12px; color: #374151; }
  details summary { cursor: pointer; color: #2563eb; }
  details td { padding: 2px 6px 2px 0; vertical-align: top; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>МКАД-роутер v2 <a href="/">← v1</a></h1>
  <p class="hint">Клик A, клик B. Обе внутри МКАД — маршрут по дорогам с учётом пробок
     (время, к/от центра, кольца и магистрали в час пик); точка вне МКАД — прямая
     с разгонной моделью.</p>
  <div class="timebar">
    <input type="datetime-local" id="departure">
    <button id="now">Сейчас</button>
    <button data-t="08:30">08:30 утро-пик</button>
    <button data-t="13:00">13:00 день</button>
    <button data-t="18:00">18:00 вечер-пик</button>
  </div>
  <div class="status"><span class="dot bad" id="osrm-dot"></span><span id="osrm-text">OSRM проверяется…</span></div>
  <div id="result">Ожидание точек…</div>
  <details>
    <summary>Модель пробок (moscow-radial-v1 + пик колец)</summary>
    <div id="model"></div>
  </details>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([55.751, 37.618], 10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

fetch('/mkad-exact.geojson').then(r => r.json()).then(fc => {
  L.geoJSON(fc, { style: { color: '#1d4ed8', weight: 3, opacity: .9, fill: false } })
    .addTo(map).bindTooltip('МКАД');
});

fetch('/model').then(r => r.json()).then(m => {
  const rows = [];
  for (const b of m.bands) {
    const f = typeof b.factors === 'object'
      ? `к центру ×${b.factors.inbound} · от центра ×${b.factors.outbound} · поперёк ×${b.factors.cross}`
      : `×${b.factors}`;
    rows.push(`<tr><td>${b.from}–${b.to}</td><td>${b.period}</td><td>${f}</td></tr>`);
  }
  const rush = m.rush_windows.map(w => `${w.from}–${w.to}`).join(', ');
  const rings = Object.entries(m.rush_factors).map(([k, v]) => `${k === 'ring' ? 'кольца' : 'магистрали'} ×${v}`).join(', ');
  const curve = m.straight_curve.map(c => `${c.up_to_m ? '<' + (c.up_to_m/1000) + ' км' : 'дальше'}: ${c.kmh}`).join(' · ');
  document.getElementById('model').innerHTML =
    `<table><tr><th>время</th><th>период</th><th>фактор</th></tr>${rows.map(r => '<tr>' + r + '</tr>').join('')}</table>` +
    `<p><b>Пик колец</b> (${rings}): ${rush} — МКАД, ТТК, Садовое кольцо.</p>` +
    `<p><b>Прибавка у центра</b>: ${m.center_bonus.map(c => `<${c.radius_below_m/1000} км +${c.add}`).join(', ')}.</p>` +
    `<p><b>Прямые</b> (разгон): ${curve} км/ч + временной фактор.</p>` +
    `<p style="color:#6b7280">База — радиальная модель проекта (core/traffic_engine.py).</p>`;
});

const depInput = document.getElementById('departure');
function setDeparture(date) {
  const pad = n => String(n).padStart(2, '0');
  depInput.value = `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}
setDeparture(new Date());
document.getElementById('now').onclick = () => setDeparture(new Date());
document.querySelectorAll('.timebar button[data-t]').forEach(b => {
  b.onclick = () => {
    const [h, m] = b.dataset.t.split(':');
    const d = new Date(); d.setHours(+h, +m, 0, 0);
    setDeparture(d);
    if (points.length === 2) route();
  };
});
depInput.onchange = () => { if (points.length === 2) route(); };

let points = [], markers = [], line = null;
const A_ICON = L.divIcon({ className: '', html: '<div class="mk">A</div>', iconSize: [22, 22], iconAnchor: [11, 11] });
const B_ICON = L.divIcon({ className: '', html: '<div class="mk b">B</div>', iconSize: [22, 22], iconAnchor: [11, 11] });

function reset(points_) {
  points = points_;
  markers.forEach(m => map.removeLayer(m));
  if (line) map.removeLayer(line);
  markers = []; line = null;
}
const fmtKm = m => (m / 1000).toFixed(m < 10000 ? 2 : 1) + ' км';
const fmtMin = s => Math.max(1, Math.round(s / 60)) + ' мин';
const badgeInside = v => `<span class="badge ${v ? 'in' : 'out'}">${v ? 'внутри МКАД' : 'вне МКАД'}</span>`;
const PERIOD_RU = { morning_peak: 'утренний пик', evening_peak: 'вечерний пик', daytime: 'день', shoulder: 'межпик', night: 'ночь' };
const CLASS_RU = { ring: 'Кольца (МКАД, ТТК, Садовое)', magistral: 'Магистрали', street: 'Улицы' };

async function route() {
  const [a, b] = points;
  const box = document.getElementById('result');
  box.innerHTML = 'Считаю маршрут…';
  const dep = new Date(depInput.value);
  try {
    const q = `a=${a.lat},${a.lng}&b=${b.lat},${b.lng}&departure=${Math.floor(dep.getTime() / 1000)}`;
    const r = await fetch('/route2?' + q);
    const d = await r.json();
    if (!r.ok) { box.innerHTML = `<span class="err">${d.error || 'ошибка маршрута'}</span>`; return; }
    line = L.polyline(d.geometry, d.mode === 'road'
      ? { color: '#1d4ed8', weight: 5, opacity: .85 }
      : { color: '#ea580c', weight: 4, dashArray: '10 10', opacity: .9 }).addTo(map);
    map.fitBounds(line.getBounds(), { padding: [40, 40] });

    const mode = d.mode === 'road'
      ? '<span class="mode-road">По дорогам — с пробками</span>'
      : '<span class="mode-straight">Прямая — есть точка вне МКАД</span>';
    let head;
    if (d.mode === 'road') {
      head = `<span class="dur"><span class="base">${fmtMin(d.base_duration_s)}</span>` +
             `<b>${fmtMin(d.duration_s)}</b> <small>(×${d.effective_factor})</small></span>`;
    } else {
      head = `<span class="dur"><b>${fmtMin(d.duration_s)}</b></span>` +
             ` <small>${d.speed_kmh} км/ч · ×${d.effective_factor} время</small>`;
    }
    const rows = d.breakdown ? Object.entries(d.breakdown).map(([cls, row]) => {
      const f = row.factors.length > 1
        ? `×${Math.min(...row.factors).toFixed(2)}–${Math.max(...row.factors).toFixed(2)}`
        : `×${row.factors[0]}`;
      return `<tr><td>${CLASS_RU[cls] || cls}</td><td>${fmtKm(row.distance_m)}</td><td>${f}</td><td>${fmtMin(row.factored_s)}</td></tr>`;
    }).join('') : '';
    const breakdown = rows ? `<table class="breakdown"><tr><th>класс</th><th>км</th><th>фактор</th><th>время</th></tr>${rows}</table>` : '';
    const rushNote = d.rush_active ? ' ⚠️ час пик колец' : '';
    box.innerHTML =
      `${mode}<br>${head} · ${fmtKm(d.distance_m)}` +
      ` <span class="badge period">${PERIOD_RU[d.period] || d.period}${rushNote}</span>` +
      `<div class="pts">${badgeInside(d.a_inside_mkad)} A ${a.lat.toFixed(5)}, ${a.lng.toFixed(5)}<br>` +
      `${badgeInside(d.b_inside_mkad)} B ${b.lat.toFixed(5)}, ${b.lng.toFixed(5)}</div>` + breakdown;
  } catch (e) {
    box.innerHTML = `<span class="err">Сеть/сервер: ${e}</span>`;
  }
}

map.on('click', e => {
  if (points.length >= 2) reset([]);
  points.push(e.latlng);
  markers.push(L.marker(e.latlng, { icon: points.length === 1 ? A_ICON : B_ICON }).addTo(map));
  document.getElementById('result').innerHTML =
    points.length === 1 ? 'Точка A задана — теперь точка B…' : 'Считаю маршрут…';
  if (points.length === 2) route();
});

fetch('/health').then(r => r.json()).then(d => {
  document.getElementById('osrm-dot').className = 'dot ' + (d.osrm ? 'ok' : 'bad');
  document.getElementById('osrm-text').textContent = d.osrm
    ? 'OSRM работает (граф в пределах МКАД, с запретами поворотов)'
    : 'OSRM недоступен — маршруты по дорогам не работают';
});

// Скриптовая проверка: demoRoute(latA, lonA, latB, lonB, departureEpoch?)
window.demoRoute = async (latA, lonA, latB, lonB, departureEpoch) => {
  reset([]);
  points = [L.latLng(latA, lonA), L.latLng(latB, lonB)];
  markers.push(L.marker(points[0], { icon: A_ICON }).addTo(map));
  markers.push(L.marker(points[1], { icon: B_ICON }).addTo(map));
  if (departureEpoch) setDeparture(new Date(departureEpoch * 1000));
  await route();
  const dep = departureEpoch || Math.floor(Date.now() / 1000);
  const r = await fetch('/route2?' + `a=${latA},${lonA}&b=${latB},${lonB}&departure=${dep}`);
  return r.json();
};
</script>
</body>
</html>
