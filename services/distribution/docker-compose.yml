services:
  distribution:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 128m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18891/navix/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports: ["127.0.0.1:18891:18891"]
    env_file: distribution.env
    environment:
      NAVIX_BIND: 0.0.0.0
    volumes:
      - ./state:/var/lib/navix-distribution
      - ./payload:/payload:ro
